name: Changeset Check

on:
  pull_request:
    branches:
      - main

jobs:
  changeset:
    name: Require changeset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset files
        run: |
          CHANGESETS=$(git diff --name-only origin/main...HEAD -- '.changeset/*.md' | grep -v README.md || true)

          if [ -z "$CHANGESETS" ]; then
            echo "::error::No changeset file found. Please run 'pnpm changeset' to add one before merging."
            echo ""
            echo "A changeset describes what changed and determines the version bump."
            echo "Run 'pnpm changeset' and follow the prompts to create one."
            exit 1
          fi

          echo "Found changeset(s):"
          echo "$CHANGESETS"
